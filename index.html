<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Досьє Бункера</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Модалка ідентифікації -->
    <div id="start-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>ІДЕНТИФІКАЦІЯ</h2>
            <div class="input-group">
                <label>Ім'я (обов'язково)</label>
                <input type="text" id="firstNameInput" placeholder="Введіть ім'я" onkeydown="if(event.key === 'Enter') startGame()">
            </div>
            <div class="input-group">
                <label>Прізвище (за бажанням)</label>
                <input type="text" id="lastNameInput" placeholder="Введіть прізвище" onkeydown="if(event.key === 'Enter') startGame()">
            </div>
            <button class="action-btn primary-btn" onclick="startGame()">РОЗПОЧАТИ</button>
        </div>
    </div>

    <!-- Модальне вікно з ПОШУКОМ для вибору -->
    <div id="edit-modal" class="modal-overlay" style="display: none; z-index: 200;">
        <div class="modal-content edit-dialog">
            <h2>ОБЕРІТЬ ВАРІАНТ</h2>
            <input type="text" id="searchInput" placeholder="Пошук (введіть слово)..." onkeyup="filterOptions()">
            <div id="optionsList" class="options-container">
                <!-- Опції додаються через JS -->
            </div>
            <button class="action-btn cancel-btn" onclick="closeEditModal()">СКАСУВАТИ</button>
        </div>
    </div>

    <!-- Нижня панель навігації (Bottom Bar) -->
    <div class="bottom-nav" id="bottomNav" style="display: none;">
        <button class="bottom-btn" onclick="scrollToCard('card-gender')" title="Біографічні дані">
            <span class="nav-icon">👤</span>
            <span class="nav-text">Біо</span>
        </button>
        <button class="bottom-btn" onclick="scrollToCard('card-profession')" title="Професія">
            <span class="nav-icon">💼</span>
            <span class="nav-text">Фах</span>
        </button>
        <button class="bottom-btn" onclick="scrollToCard('card-health')" title="Здоров'я та Фобії">
            <span class="nav-icon">⚕️</span>
            <span class="nav-text">Стан</span>
        </button>
        <button class="bottom-btn" onclick="scrollToCard('card-inventory')" title="Рюкзак та Хобі">
            <span class="nav-icon">🎒</span>
            <span class="nav-text">Багаж</span>
        </button>
        <button class="bottom-btn" onclick="scrollToCard('card-special1')" title="Стоп Бункер">
            <span class="nav-icon">🛑</span>
            <span class="nav-text">Дії</span>
        </button>
    </div>

    <div class="app-wrapper">
        <div class="sheet-container">
            <div class="header-container">
                <div class="photo-box" id="profile-photo"></div>
                <div class="header-text">
                    <h1>ОСОБОВА СПРАВА</h1>
                    <p class="sub-header">ОБ'ЄКТ № <span id="candidate-id">0000</span></p>
                    <p class="sub-header" id="candidate-name" style="display:none;"></p>
                </div>
            </div>

            <div id="character-sheet" class="hidden">
                <div id="global-lock" class="global-lock">
                    <button class="action-btn primary-btn large-btn" onclick="unlockSheetAndShowNav()">РОЗСЕКРЕТИТИ ДАНІ</button>
                </div>

                <!-- Адаптивна сітка карток -->
                <div class="cards-grid">
                    
                    <div class="trait-card" id="card-gender">
                        <div class="card-header">
                            <span class="label">СТАТЬ</span>
                            <div class="action-btns">
                                <button class="icon-btn" onclick="openEditModal('gender', 'genders')" title="Вибрати вручну">✏️</button>
                                <button class="icon-btn" onclick="resetField('gender', 'genders')" title="Випадково">🎲</button>
                            </div>
                        </div>
                        <div class="field-content" id="gender"></div>
                    </div>

                    <div class="trait-card" id="card-age">
                        <div class="card-header">
                            <span class="label">ВІК</span>
                            <div class="action-btns">
                                <button class="icon-btn" onclick="openEditModal('age', 'ages')" title="Вибрати вручну">✏️</button>
                                <button class="icon-btn" onclick="resetField('age', 'ages')" title="Випадково">🎲</button>
                            </div>
                        </div>
                        <div class="field-content" id="age"></div>
                    </div>

                    <div class="trait-card" id="card-body">
                        <div class="card-header">
                            <span class="label">СТАТУРА</span>
                            <div class="action-btns">
                                <button class="icon-btn" onclick="openEditModal('body', 'bodies')" title="Вибрати вручну">✏️</button>
                                <button class="icon-btn" onclick="resetField('body', 'bodies')" title="Випадково">🎲</button>
                            </div>
                        </div>
                        <div class="field-content" id="body"></div>
                    </div>

                    <div class="trait-card" id="card-profession">
                        <div class="card-header">
                            <span class="label">ПРОФЕСІЯ</span>
                            <div class="action-btns">
                                <button class="icon-btn" onclick="openEditModal('profession', 'professions')" title="Вибрати вручну">✏️</button>
                                <button class="icon-btn" onclick="resetField('profession', 'professions')" title="Випадково">🎲</button>
                            </div>
                        </div>
                        <div class="field-content" id="profession"></div>
                    </div>

                    <div class="trait-card" id="card-health">
                        <div class="card-header">
                            <span class="label">ЗДОРОВ'Я</span>
                            <div class="action-btns">
                                <button class="icon-btn" onclick="openEditModal('health', 'health')" title="Вибрати вручну">✏️</button>
                                <button class="icon-btn" onclick="resetField('health', 'health')" title="Випадково">🎲</button>
                            </div>
                        </div>
                        <div class="field-content" id="health"></div>
                    </div>

                    <div class="trait-card" id="card-phobia">
                        <div class="card-header">
                            <span class="label">ФОБІЯ</span>
                            <div class="action-btns">
                                <button class="icon-btn" onclick="openEditModal('phobia', 'phobias')" title="Вибрати вручну">✏️</button>
                                <button class="icon-btn" onclick="resetField('phobia', 'phobias')" title="Випадково">🎲</button>
                            </div>
                        </div>
                        <div class="field-content" id="phobia"></div>
                    </div>

                    <div class="trait-card wide-card" id="card-hobby">
                        <div class="card-header">
                            <span class="label">ХОБІ</span>
                            <div class="action-btns">
                                <button class="icon-btn" onclick="openEditModal('hobby', 'hobbies')" title="Вибрати вручну">✏️</button>
                                <button class="icon-btn" onclick="resetField('hobby', 'hobbies')" title="Випадково">🎲</button>
                            </div>
                        </div>
                        <div class="field-content" id="hobby"></div>
                    </div>

                    <div class="trait-card wide-card" id="card-inventory">
                        <div class="card-header">
                            <span class="label">РЮКЗАК</span>
                            <div class="action-btns">
                                <button class="icon-btn" onclick="openEditModal('inventory', 'inventory')" title="Вибрати вручну">✏️</button>
                                <button class="icon-btn" onclick="resetField('inventory', 'inventory')" title="Випадково">🎲</button>
                            </div>
                        </div>
                        <div class="field-content" id="inventory"></div>
                    </div>

                    <div class="trait-card wide-card" id="card-info">
                        <div class="card-header">
                            <span class="label">ДОДАТКОВА ІНФОРМАЦІЯ</span>
                            <div class="action-btns">
                                <button class="icon-btn" onclick="openEditModal('info', 'additional_info')" title="Вибрати вручну">✏️</button>
                                <button class="icon-btn" onclick="resetField('info', 'additional_info')" title="Випадково">🎲</button>
                            </div>
                        </div>
                        <div class="field-content" id="info"></div>
                    </div>

                    <div class="trait-card special-card" id="card-special1">
                        <div class="card-header">
                            <span class="label">СТОП БУНКЕР 1</span>
                            <div class="action-btns">
                                <button class="icon-btn lightning-btn" onclick="useSpecial('special1')" title="Використати">⚡</button>
                                <button class="icon-btn" onclick="openEditModal('special1', 'specials')" title="Вибрати вручну">✏️</button>
                                <button class="icon-btn" onclick="resetField('special1', 'specials')" title="Випадково">🎲</button>
                            </div>
                        </div>
                        <div class="field-content" id="special1"></div>
                    </div>

                    <div class="trait-card special-card" id="card-special2">
                        <div class="card-header">
                            <span class="label">СТОП БУНКЕР 2</span>
                            <div class="action-btns">
                                <button class="icon-btn lightning-btn" onclick="useSpecial('special2')" title="Використати">⚡</button>
                                <button class="icon-btn" onclick="openEditModal('special2', 'specials')" title="Вибрати вручну">✏️</button>
                                <button class="icon-btn" onclick="resetField('special2', 'specials')" title="Випадково">🎲</button>
                            </div>
                        </div>
                        <div class="field-content" id="special2"></div>
                    </div>

                </div>

                <div class="footer-stamp">СТАТУС: ОЧІКУЄ РІШЕННЯ</div>
            </div>
        </div>
        
        <button id="generateBtn" class="action-btn secondary-btn" style="display:none; width: 100%; margin-top: 10px;" onclick="generateCharacter()">ЗГЕНЕРУВАТИ НОВЕ ДОСЬЄ</button>
    </div>

    <script src="script.js"></script>
    <script>
        function unlockSheetAndShowNav() {
            unlockSheet();
            document.getElementById('bottomNav').style.display = 'flex';
        }
    </script>
</body>
</html>
